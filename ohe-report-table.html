    // Function to calculate totals
    function calculateTotals(data) {
        let totalNumber = 0;
        let totalMinutes = 0;
        
        for (let i = 0; i < data.length; i += 2) {
            totalNumber += data[i] || 0;
            totalMinutes += data[i + 1] || 0;
        }
        
        return { totalNumber, totalMinutes };
    }

    // Function to generate table rows
    function generateRows(data, category) {
        let rows = '';
        let grandTotalNumber = 0;
        let grandTotalMinutes = 0;

        data.forEach(item => {
            const { totalNumber, totalMinutes } = calculateTotals(item.data);
            grandTotalNumber += totalNumber;
            grandTotalMinutes += totalMinutes;

            rows += `<td>${item.id}</td>`;

            rows += `<td>min</td>`;
            rows += `<td>${item.std}</td>`;

            });

            rows += `</tr>`;
        });

        rows += `<td>min</td>`;
        rows += `<td colspan="64"></td>`;

    const totalLoss = lossResult.grandTotalMinutes;

    html += `<td>${ohe}%</td>`;
